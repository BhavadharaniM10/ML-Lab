<!DOCTYPE html>
<html>
<head>
    <title>Loan Prediction - Random Forest</title>
</head>
<body>

<h2>Loan Approval Prediction (Random Forest)</h2>

<form action="/predict" method="post">

Gender:
<select name="Gender">
    <option value="Male">Male</option>
    <option value="Female">Female</option>
</select><br><br>

Married:
<select name="Married">
    <option value="Yes">Yes</option>
    <option value="No">No</option>
</select><br><br>

Dependents:
<select name="Dependents">
    <option value="0">0</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3+">3+</option>
</select><br><br>

Education:
<select name="Education">
    <option value="Graduate">Graduate</option>
    <option value="Not Graduate">Not Graduate</option>
</select><br><br>

Self Employed:
<select name="Self_Employed">
    <option value="Yes">Yes</option>
    <option value="No">No</option>
</select><br><br>

Applicant Income:
<input type="number" name="ApplicantIncome" required><br><br>

Coapplicant Income:
<input type="number" name="CoapplicantIncome" required><br><br>

Loan Amount:
<input type="number" name="LoanAmount" required><br><br>

Loan Amount Term:
<input type="number" name="Loan_Amount_Term" value="360"><br><br>

Credit History:
<select name="Credit_History">
    <option value="1.0">1.0</option>
    <option value="0.0">0.0</option>
</select><br><br>

Property Area:
<select name="Property_Area">
    <option value="Urban">Urban</option>
    <option value="Semiurban">Semiurban</option>
    <option value="Rural">Rural</option>
</select><br><br>

<button type="submit">Predict</button>

</form>

<h3>{{ prediction_text }}</h3>

</body>
</html>
